    let up=false,dn=false;
    for(let xx=l;xx<W&&ok(y*W+xx);xx++){const k=y*W+xx;seen[k]=1;d[k*4]=fr;d[k*4+1]=fg;d[k*4+2]=fb;d[k*4+3]=255;
      if(y>0){const u=ok(k-W);if(u&&!up)st.push(xx,y-1);up=u}

  do{const chunk=pd.p.slice(0,400);pd.p=pd.p.slice(400);const last=!pd.p.length;
    CV.sendOp({k:'s',id:s.id,c:s.c,s:s.s,e:s.e,f:0,st:pd.st,p:chunk,end:(end&&last)?1:0});pd.st+=chunk.length/2}while(pd.p.length);

  return `<div class="grp"><div class="lbl">${ic('clock')}Turn time</div>${seg('time',[60,80,120,0],['60s','80s','120s','No timer'])}</div>

  <div class="grp"><button type="button" class="tgl" data-tgl="hints" aria-pressed="${!!cfg.hints}"${o.ro?' disabled':''}><span><b>Hints</b><br><span class="note">Reveal letters as time passes</span></span><span class="sw"></span></button></div>

function syncSettings(root,cfg){
  $$('[data-seg]',root).forEach(g=>$$('button',g).forEach(b=>b.setAttribute('aria-pressed',String(String(cfg[g.dataset.seg])===b.dataset.v))));
  const t=$('[data-tgl="hints"]',root);if(t)t.setAttribute('aria-pressed',String(!!cfg.hints));
}
function bindSettings(root,cfg,onChange){
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!root.contains(b))return;let ch=false;
    const sg=b.closest('[data-seg]');
    if(sg&&!sg.dataset.ro){cfg[sg.dataset.seg]=+b.dataset.v;ch=true}
    else if(b.dataset.tgl){cfg.hints=!cfg.hints;ch=true}
    if(ch){syncSettings(root,cfg);onChange&&onChange(cfg)}
  });

}

function bindTools(root){

    if(b.dataset.col!==undefined){t.c=+b.dataset.col;t.e=0}
    else if(b.dataset.sz!==undefined){t.s=+b.dataset.sz;t.f=0}
    else if('ers' in b.dataset){t.e=t.e?0:1;t.f=0}
    else if('fill' in b.dataset){t.f=t.f?0:1;t.e=0}
    else if('undo' in b.dataset){CV.undo()}
    else if('clear' in b.dataset){CV.clear()}

  });

}

/* ===== NETWORK (WebSocket to the Node server) ===== */
const S={mode:null,screen:'home',pendingCode:'',prev:'home'};
function getUid(){
  let u=lsGet('uid','');
  if(!/^[A-Za-z0-9_-]{8,40}$/.test(u)){
    const a=new Uint8Array(12);
    if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<12;i++)a[i]=Math.random()*256;
    u=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');lsSet('uid',u);
  }
  return u;
}
const ON={uid:getUid(),name:lsGet('myname',''),code:null,st:null,feed:[],chat:[],unread:0,tk:'',cfg:null,tickAt:0};
const NET={ws:null,off:0,tries:0,pend:null,keep:false};
const snow=()=>Date.now()+NET.off;
const netSend=o=>{if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o))};
function setConn(ok){const c=$('#conn');if(c)c.hidden=ok||S.mode!=='on'}
function netConnect(){
  if(NET.ws&&(NET.ws.readyState===0||NET.ws.readyState===1))return;
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');NET.ws=ws;
  ws.onopen=()=>{NET.tries=0;setConn(true);if(S.mode==='on'&&ON.code&&ON.name)netSend({t:'join',code:ON.code,name:ON.name,uid:ON.uid,re:1})};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}netIn(m)};
  ws.onclose=()=>{
    if(NET.ws===ws)NET.ws=null;
    if(NET.pend){const p=NET.pend;NET.pend=null;p.rej(new Error('Lost connection to the server.'))}
    if(S.mode==='on'){setConn(false);setTimeout(netConnect,Math.min(8000,500*Math.pow(2,NET.tries++)))}
  };
  ws.onerror=()=>{};
}
function netReady(){return new Promise((res,rej)=>{netConnect();const t0=Date.now();(function chk(){const w=NET.ws;if(w&&w.readyState===1)return res();if(Date.now()-t0>8000)return rej(new Error('Could not reach the game server.'));setTimeout(chk,80)})()})}
async function netRequest(msg){
  await netReady();
  return new Promise((res,rej)=>{NET.pend={res,rej};netSend(msg);setTimeout(()=>{if(NET.pend&&NET.pend.res===res){NET.pend=null;rej(new Error('The server did not answer. Try again.'))}},9000)});
}
function netIn(m){
  switch(m.t){
    case'joined':ON.code=m.code;if(NET.pend){const p=NET.pend;NET.pend=null;p.res(m)}break;
    case'error':
      if(NET.pend){const p=NET.pend;NET.pend=null;p.rej(new Error(m.msg))}
      else if(m.gone)onKicked(m.msg||'That party is gone.');else toast(m.msg||'Something went wrong.');
      break;
    case'state':stateIn(m);break;
    case'canvas':CV.load(m.strokes||[]);break;
    case'stroke':if(ON.st&&!iAmDrawer()){CV.apply(m.op);if(CV.needSync){CV.needSync=false}}break;
    case'feed':
      if(m.kind==='ok')SND.correct();
      onFeed({kind:m.kind,n:m.n,txt:m.txt});break;
    case'chat':
      if(m.from!==ON.uid){SND.chat();if(!$('#wfeed')&&!$('#chatl'))ON.unread++;onUpdBadge()}
      onChatIn({n:m.n,txt:m.txt,me:m.from===ON.uid});break;
    case'kicked':onKicked(m.msg||'You were removed from the party.');SND.kick();break;
  }
}
function onFeed(e){ON.feed.push(e);if(ON.feed.length>60)ON.feed.shift();onUpdFeed()}
function onChatIn(e){ON.chat.push(e);if(ON.chat.length>100)ON.chat.shift();onUpdChat();onUpdFeed()}
function onKicked(msg){
  ON.code=null;ON.st=null;ON.cfg=null;ON.tk='';ON.feed=[];ON.chat=[];CV.canDraw=false;CV.onOp=null;
  S.mode=null;lsSet('party','');setConn(true);toast(msg);App.key='';go('home');
}
const iAmHost=()=>!!ON.st&&ON.st.host===ON.uid;
const iAmDrawer=()=>!!ON.st&&ON.st.drawer===ON.uid;
const plist=()=>ON.st?ON.st.players:[];
const myP=()=>plist().find(p=>p.id===ON.uid)||null;
const setOf=()=>Object.assign({time:80,rounds:1,hints:true},ON.st&&ON.st.set||{});
function stateIn(m){
  const prev=ON.st;NET.off=m.now-Date.now();ON.code=m.code;
  if(prev){
    const a=new Set(prev.players.filter(p=>!p.bot).map(p=>p.id)),b=new Set(m.players.filter(p=>!p.bot).map(p=>p.id));
    for(const id of b)if(!a.has(id)&&id!==ON.uid){SND.join();const pl=m.players.find(p=>p.id===id);onFeed({kind:'sys',txt:`${pl.name} joined the party.`})}
    for(const id of a)if(!b.has(id)&&id!==ON.uid)SND.leave();
    if(!prev.kick&&m.kick)SND.kick();
  }
  ON.st=m;
  if(m.tk!==ON.tk){ON.tk=m.tk;ON.feed=[];ON.tickAt=0;CV.reset();if(m.phase==='pick'&&m.drawer===ON.uid)SND.yourTurn()}
  else if(prev&&prev.phase!=='pick'&&m.phase==='pick'&&m.drawer===ON.uid)SND.yourTurn();
  CV.canDraw=m.phase==='draw'&&m.drawer===ON.uid;
  lsSet('party',m.code);
  if(S.mode==='on'&&S.screen==='online')render();
}

/* ---- pick a word ---- */
function onPickScreen(){
  const s=ON.st,me=iAmDrawer(),d=plist().find(p=>p.id===s.drawer),dn=d?d.name:'Someone';
  const center=me?`<div style="text-align:center;margin-top:6px"><div class="lbl" style="justify-content:center">${ic('brush')}Your turn</div><h2 class="big gt">Pick a word</h2><p class="mid" id="pt"></p></div>
  <div class="wcards">${s.words.map((w,i)=>`<button class="wcard" data-i="${i}">${esc(cap(w))}</button>`).join('')}</div>`
  :`<div style="text-align:center;margin-top:40px;display:flex;flex-direction:column;gap:10px;align-items:center"><div class="bub" style="width:64px;height:64px;border-radius:20px;background:${avColor(s.drawer)};color:#fff;display:grid;place-items:center;font:800 1.8rem var(--fh)">${esc(initial(dn))}</div><h2 class="big"><span class="gt">${esc(dn)}</span> is choosing a word</h2><p class="mid">Round ${s.round} of ${setOf().rounds}. Get ready to guess.</p></div>`;
  const html=onTop(true)+`<div class="g3">
  <div class="gcol">${codeBtn()}<div class="lbl">${ic('trophy','sm')}Scores<span class="r">${plist().length} playing</span></div><div class="plrpanel" id="plrpanel"></div></div>
  <div class="gcol mid">${center}</div>
  ${onChatPanelHTML(false)}
  </div>`;
  show('pick:'+s.tk+':'+(me?1:0),html,root=>{onBindTop(true);onBindPlrPanel(root);onBindChatPanel();
    root.addEventListener('click',e=>{const b=e.target.closest('.wcard');if(!b)return;$$('.wcard',root).forEach(x=>x.disabled=true);netSend({t:'pick',i:+b.dataset.i})})},
  ()=>{onUpdPlrPanel();onUpdFeed();const pt=$('#pt');if(pt)pt.textContent='Choosing in '+Math.max(0,Math.ceil((ON.st.pickEnd-snow())/1000))+'s'},true);
}
/* ---- drawing turn ---- */
function onDrawScreen(){
  const s=ON.st,me=iAmDrawer();
  const html=onTop(true)+`<div class="g3">
  <div class="gcol">${codeBtn()}<div class="lbl">${ic('trophy','sm')}Scores<span class="r">Round ${s.round}/${setOf().rounds}</span></div><div class="plrpanel" id="plrpanel"></div></div>
  <div class="gcol mid">
    <div class="gtimer"><div class="tm gt" id="tm"></div><div class="bar" style="flex:1"><i id="tbar"></i></div></div>
    <div class="gword"><small id="wl">${me?'Draw this':'Guess the word'}</small><div class="blanks" id="blanks" aria-live="polite"></div></div>
    <div class="canvaswrap">${canvasHTML()}${me?toolsHTML():''}</div>
  </div>
  ${onChatPanelHTML(!me)}
  </div>`;
  show('draw:'+s.tk+':'+(me?'d':'g'),html,root=>{
    onBindTop(true);CV.mount($('#cv'));CV.canDraw=me;onBindPlrPanel(root);
    if(me){CV.tool={c:0,s:1,e:0,f:0};bindTools(root);
      CV.onOp=m=>netSend({t:'stroke',op:m});
      $('#endt').onclick=()=>netSend({t:'endturn'});
      onBindChatPanel();
    }else{CV.onOp=null;onBindChatPanel(true)}
    onUpdFeed();
  },onDrawUpd,true);
}
function onDrawUpd(){
  const s=ON.st;if(!s||s.phase!=='draw')return;const me=iAmDrawer(),mp=myP();
  const tm=$('#tm'),bar=$('#tbar');
  if(s.tEnd){const leftS=Math.ceil(Math.max(0,s.tEnd-snow())/1000);
    if(leftS<=5&&leftS>0&&leftS!==ON.tickAt){ON.tickAt=leftS;SND.tick()}
    else if(leftS<=0&&ON.tickAt!==-1){ON.tickAt=-1;SND.timeup()}}
  if(tm){if(s.tEnd){const tot=s.tEnd-s.tStart,left=clamp(s.tEnd-snow(),0,tot);tm.textContent=Math.ceil(left/1000);bar.style.transform=`scaleX(${left/tot})`}else{tm.textContent='∞';bar.style.transform='scaleX(1)'}}
  const got=!!(mp&&mp.got),bl=$('#blanks');
  if(bl){
    if(s.word){bl.textContent=cap(s.word);bl.classList.add('w')}
    else{bl.classList.remove('w');bl.textContent=s.hint}
    bl.setAttribute('aria-label',s.word||s.wordLen+' letters')}
  const gin=$('#win');if(gin&&!me){if(gin.disabled!==got){gin.disabled=got;const b=$('#wsend');if(b)b.disabled=got;gin.placeholder=got?'You got it! Chat is private now.':'Type your guess'}}
  const wl=$('#wl');if(wl&&!me)wl.textContent=got?'You got it!':'Guess the word';
  onUpdPlrPanel();
}
/* ---- result ---- */
function onResultScreen(){
  const s=ON.st,r=s.res||{got:[],word:'',dp:0};
  const delta={};r.got.forEach(g=>{delta[g.id]=g.pts});if(r.dp&&r.drawer)delta[r.drawer]=(delta[r.drawer]||0)+r.dp;
  const html=onTop()+`<div class="card" style="text-align:center"><div class="lbl" style="justify-content:center">The word was</div><div class="big gt">${esc(cap(r.word||''))}</div>
  <p class="mid">${r.got.length?esc(r.got.map(g=>g.name).join(', '))+' guessed it.':'Nobody got it this time.'}</p></div>
  <div class="grp"><div class="lbl">${ic('trophy')}Scoreboard</div><div id="sb" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="foot"><p class="mid" id="nxt"></p>${iAmHost()?`<button class="btn soft" id="skip">Next turn now</button>`:''}</div>`;
  show('result:'+s.tk+':'+(iAmHost()?1:0),html,()=>{onBindTop();const k=$('#skip');if(k)k.onclick=()=>netSend({t:'skip'})},()=>{
    const sorted=plist().map(p=>({id:p.id,name:p.name,score:p.score,me:p.id===ON.uid})).sort((a,b)=>b.score-a.score);
    const sb=$('#sb'),sig=sorted.map(p=>p.id+p.score).join();if(sb&&sb.dataset.sig!==sig){sb.dataset.sig=sig;sb.innerHTML=rankRows(sorted,delta)}
    const n=$('#nxt');if(n)n.textContent='Next turn in '+Math.max(0,Math.ceil((ON.st.resEnd-snow())/1000))+'s';
  });
}
/* ---- final ---- */
function onFinalScreen(){
  const s=ON.st,host=iAmHost();
  const html=onTop()+`<div class="card" style="text-align:center;gap:6px"><div class="lbl" style="justify-content:center">${ic('trophy')}Winner</div><div class="big gt" id="wn"></div><p class="mid" id="wp"></p><div id="pod"></div></div>
  <div class="grp"><div class="lbl">${ic('users')}Scoreboard</div><div id="sb" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="foot">${host?'':'<p class="mid">The host decides what happens next.</p>'}<button class="btn pri" id="again" ${host?'':'disabled'}>${ic('refresh')}<span class="fh">Play again</span></button><div class="two"><button class="btn soft" id="newg" ${host?'':'disabled'}>New game</button><button class="btn soft" id="lv">Leave</button></div></div>`;
  show('final:'+s.gen+':'+(host?1:0),html,()=>{onBindTop();$('#lv').onclick=onLeave;$('#again').onclick=()=>netSend({t:'start'});$('#newg').onclick=()=>netSend({t:'lobby'})},()=>{
    const sorted=plist().map(p=>({id:p.id,name:p.name,score:p.score,me:p.id===ON.uid})).sort((a,b)=>b.score-a.score);
    const sig=sorted.map(p=>p.id+p.score).join();const sb=$('#sb');
    if(sb&&sb.dataset.sig!==sig&&sorted.length){sb.dataset.sig=sig;sb.innerHTML=rankRows(sorted);$('#wn').textContent=sorted[0].name;$('#wp').textContent=sorted[0].score+' points';$('#pod').innerHTML=podiumHTML(sorted)}
  });
}

/* ===== HOME, HOW TO PLAY, ROUTING, BOOT ===== */
function go(screen){S.screen=screen;render()}
function render(){
  switch(S.screen){
    case'home':return homeScreen();case'how':return howScreen();
    case'onEntry':return onEntryScreen();case'online':return onScreen();
  }
}
function homeScreen(){
  const saved=lsGet('party','');
  const html=`<div class="top"><div class="logo">${LOGO}<span>Sketchy</span></div><div style="flex:1"></div><button class="ib" id="hhow" aria-label="How to play">${ic('help')}</button></div>
  <div class="hero">${ic('brush','wm')}<span class="tag">Draw and guess</span><h1>Sketch it.<br>Guess it.</h1><p>One player draws a secret word. Everyone else races to guess it before the time runs out.</p>
  <button class="pill" id="play">${ic('play')}<span class="fh">Play online</span></button></div>
  <p class="note">Each player uses their own device. Create a party or join with a code or link.</p>
  ${saved?`<button class="row" id="rj"><div class="bub red">${ic('refresh')}</div><div class="tx"><b>Rejoin party ${esc(saved)}</b><span>Pick up where you left off</span></div></button>`:''}
  <button class="row" id="how"><div class="bub">${ic('help')}</div><div class="tx"><b>How to play</b><span>Rules, scoring and hints</span></div></button>`;
  show('home',html,()=>{
    $('#play').onclick=()=>go('onEntry');
    const rj=$('#rj');if(rj)rj.onclick=()=>{S.pendingCode='';go('onEntry')};
    $('#how').onclick=$('#hhow').onclick=()=>{S.prev='home';go('how')};
  });
}
function howScreen(){
  const html=topbar({title:'How to play'})+`
  <div class="card how"><h3 class="gt" style="font-size:1.4rem">The idea</h3><p>Each turn one player is the drawer. They pick a word from three choices and draw it. Everyone else guesses.</p></div>
  <div class="card"><div class="lbl">${ic('check')}Guessing</div><ol class="how" style="margin:0;padding-left:20px"><li>You see blanks and the word length, like _ _ A _ _ E. Hint letters appear as time passes if hints are on.</li>
  <li>Type your guess. Capitals, spaces and punctuation do not matter.</li><li>A guess that is one letter off gives you a private "So close!". Other players do not see it.</li><li>Once you guess it, you wait for the others. Chat between people who already know the word stays private.</li></ol></div>
  <div class="card"><div class="lbl">${ic('trophy')}Scoring</div><ul class="how" style="margin:0;padding-left:20px"><li>Guessers earn 100 points for a fast guess, down to 20 as time runs out. The first guesser gets a 25 point bonus.</li><li>The drawer earns 50 points for every player who guesses.</li><li>The turn ends early when everyone has guessed.</li><li>Everyone draws once per round. The host picks 1, 2, 3 or 5 rounds.</li></ul></div>
  <div class="card"><div class="lbl">${ic('userx')}Votekick</div><p>Hover or tap a player in the scores panel to reveal a kick icon. Starting a vote asks everyone else to vote Yes or No. If a majority votes Yes, that player is removed from the party.</p></div>
  <div class="card"><div class="lbl">${ic('volume')}Sound</div><p>Notes play for your turn, correct guesses, chat messages, players joining or leaving, the final countdown and votekicks. Mute anytime with the speaker icon.</p></div>
  <div class="card"><div class="lbl">${ic('globe')}Online</div><p>The host creates a party and shares the code or invite link. Everyone joins on their own device. Want to test alone? Add the demo bots Milo and Zara in the lobby.</p></div>
  <div class="foot"><button class="btn pri" id="ok"><span class="fh">Got it</span></button></div>`;
  show('how',html,()=>{$('#tb-back').onclick=$('#ok').onclick=()=>go(S.prev||'home')});
}
setInterval(()=>{if(S.mode==='on'&&S.screen==='online'&&App.upd)App.upd()},250);
function readHash(){const h=(location.hash||'').replace('#','');if(/^[A-Za-z0-9]{4,8}$/.test(h)&&S.mode!=='on'){S.pendingCode=h.toUpperCase();go('onEntry')}}
window.addEventListener('hashchange',readHash);
render();readHash();
</script>
</body></html>
